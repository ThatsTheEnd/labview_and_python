[project]
name = "ni-days-demo"
version = "0.1.0"
description = "RabbitMQ demo with UI, simulator, and analysis modules"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aio-pika>=9.4.0",
  "nicegui>=2.0.0",
  "numpy>=1.26.0",
  "plotly>=5.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ty>=0.0.0",
  "poethepoet>=0.24.0",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.poe.tasks]
test = "uv run pytest tests"
typecheck = "uv run ty check src/"

[tool.poe.tasks.run-simulator]
shell = "cd src && uv run python -m simulator"

[tool.poe.tasks.run-analysis]
shell = "cd src && uv run python -m analysis"

[tool.poe.tasks.run-ui]
shell = "cd src && uv run python -m ui"

[tool.poe.tasks.run-all]
shell = "cd src && uv run python launch_all.py"

